        /* Hero Link Directory */
        .hero-links {

        .link-directory {

        }

            position: relative;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-box input {
            width: 100%;
            padding: 1rem 1.5rem;
            background: var(--glass-bg);
            border: var(--glass-border);
            border-radius: 50px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
        }

        .search-box input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        .file-section {
            margin-bottom: 1.5rem;
            background: var(--glass-bg);
            border: var(--glass-border);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--glass-shadow);
        }

        .file-header {
            background: rgba(255, 255, 255, 0.03);
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-name {
            font-family: 'Courier New', Courier, monospace;
            color: var(--primary-light);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .link-list {
            padding: 0;
        }

        .link-item {
            padding: 0.5rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: background 0.2s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }

        .link-item:last-child {
            border-bottom: none;
        }

        .link-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .link-url {
            color: var(--text-secondary);
            text-decoration: none;
            word-break: break-all;
            font-size: 0.9rem;
            flex-grow: 1;
            transition: color 0.2s;
        }

        .link-url:hover {
            color: var(--primary-color);
        }

        .link-tag {
            font-size: 0.7rem;
            padding: 0.2rem 0.6rem;
            border-radius: 50px;
            background: rgba(56, 189, 248, 0.1);
            color: var(--primary-light);
            white-space: nowrap;
            font-weight: 600;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary-color);
            box-shadow: 0 0 10px var(--primary-color);
        }

        .stats-bar {
            display: flex;
            gap: 2rem;
            margin-bottom: 2rem;
            padding: 1.25rem 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            border: var(--glass-border);
            justify-content: center;
        }

        .stat-item {
            color: var(--text-secondary);
        }

        .stat-item span {
            font-weight: 800;
            color: var(--primary-color);
            margin-left: 0.5rem;
            font-size: 1.1rem;
        }
    </style>
</head>

                const allData = JSON.parse(rawDataString);

                // Filtrage des liens redondants
                const data = allData.filter(item => !excludedLinks.includes(item.Link));

                if (data.length === 0) {
                    container.innerHTML = '<p style="opacity:0.5; padding: 4rem; text-align: center;">Aucun lien détecté après filtrage.</p>';
                    return;
                }

                // Groupement par fichier
                const groups = data.reduce((acc, curr) => {
                    const file = curr.File;
                    if (!acc[file]) acc[file] = new Set();
                    acc[file].add(curr.Link);
                    return acc;
                }, {});

                const allUniqueLinks = new Set(data.map(d => d.Link));
                totalFilesSpan.textContent = Object.keys(groups).length;
                totalLinksSpan.textContent = data.length;
                uniqueLinksSpan.textContent = allUniqueLinks.size;

                const renderLinks = (filter = '') => {
                    container.innerHTML = '';
                    const filterLower = filter.toLowerCase();

                    // Trier les fichiers par nom
                    Object.entries(groups).sort().forEach(([file, links]) => {
                        const filteredLinks = Array.from(links).filter(link =>
                            link.toLowerCase().includes(filterLower) || file.toLowerCase().includes(filterLower)
                        );

                        if (filteredLinks.length > 0) {
                            const section = document.createElement('section');
                            section.className = 'file-section';

                            const header = document.createElement('div');
                            header.className = 'file-header';
                            header.innerHTML = `
                                <span class="file-name">${file}</span>
                                <span class="link-tag">${filteredLinks.length} lien${filteredLinks.length > 1 ? 's' : ''}</span>
                            `;

                            const list = document.createElement('div');
                            list.className = 'link-list';

                            filteredLinks.forEach(link => {
                                const item = document.createElement('div');
                                item.className = 'link-item';
                                let domain = 'link';
                                try { domain = new URL(link).hostname.replace('www.', ''); } catch (e) { }

                                item.innerHTML = `
                                    <div class="status-indicator"></div>
                                    <a href="${link}" target="_blank" class="link-url">${link}</a>
                                    <span class="link-tag" style="background: rgba(255,255,255,0.03); color: #888; font-weight: normal; font-size: 0.65rem;">${domain}</span>
                                `;
                                list.appendChild(item);
                            });

                            section.appendChild(header);
                            section.appendChild(list);
                            container.appendChild(section);
                        }
                    });
                };

                renderLinks();
                document.getElementById('link-search').addEventListener('input', (e) => renderLinks(e.target.value));

            } catch (error) {
